<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Excel Formula Formatter</title>
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <!-- Vendored formatter library (plain global). Must load before the taskpane bundle. -->
    <script type="text/javascript" src="excel-formula.js"></script>
    <style>
      :root { --bg: #ffffff; --fg: #2b2d42; --muted: #6b7280; --line: #e5e7eb; --accent: #ef8354; --accent-d: #e06c3a; --field: #f8f9fb; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1f2033; --fg: #edf2f4; --muted: #9aa0b4; --line: #3a3c52; --accent: #ef8354; --accent-d: #f2a07d; --field: #2b2d42; }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body { font-family: "Segoe UI", -apple-system, system-ui, sans-serif; color: var(--fg); background: var(--bg); font-size: 13px; }
      .app { display: flex; flex-direction: column; height: 100vh; padding: 14px; gap: 12px; }
      header h1 { font-size: 15px; margin: 0 0 2px; }
      header p { font-size: 12px; margin: 0; color: var(--muted); }
      .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
      .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
      label.opt { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
      .opt-title { font-weight: 600; margin-right: 4px; }
      input[type="number"] { width: 48px; font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--field); color: var(--fg); }
      .preview-wrap { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 120px; }
      textarea {
        flex: 1 1 auto; width: 100%; resize: none; font-family: "Cascadia Code", Consolas, "Courier New", monospace;
        font-size: 13px; line-height: 1.45; tab-size: 4; padding: 10px; border: 1px solid var(--line);
        border-radius: 8px; background: var(--field); color: var(--fg); white-space: pre; overflow: auto;
      }
      .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      button { font: inherit; font-size: 13px; cursor: pointer; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--field); color: var(--fg); }
      button:hover { border-color: var(--accent); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.primary:hover { background: var(--accent-d); border-color: var(--accent-d); }
      .btns .wide { grid-column: 1 / -1; }
      .status { font-size: 12px; color: var(--muted); min-height: 16px; }
      .status.err { color: var(--accent-d); }
      .hint { font-size: 11px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>Formula Formatter</h1>
        <p>Beautify or minify the formula in the selected cell.</p>
      </header>

      <div class="card">
        <div class="row">
          <span class="opt-title">Indent</span>
          <label class="opt"><input type="radio" name="indentKind" value="spaces" checked /> Spaces</label>
          <label class="opt"><input type="radio" name="indentKind" value="tab" /> Tab</label>
          <label class="opt">Size <input type="number" id="indentSize" min="1" max="8" value="4" /></label>
        </div>
      </div>

      <div class="preview-wrap">
        <textarea id="preview" spellcheck="false" placeholder="Click &quot;Load from cell&quot; to pull in the selected cell's formula, or type/paste a formula here."></textarea>
      </div>

      <div class="status" id="status"></div>

      <div class="btns">
        <button id="load" class="wide" type="button">Load from cell</button>
        <button id="beautify" type="button">Beautify</button>
        <button id="minify" type="button">Minify</button>
        <button id="apply" class="primary wide" type="button">Write back to cell</button>
      </div>
      <div class="hint">Tip: expand the formula bar (Ctrl+Shift+U) to see multi-line formulas.</div>
    </div>
    <!-- HtmlWebpackPlugin injects the "taskpane" bundle here. -->
  </body>
</html>
