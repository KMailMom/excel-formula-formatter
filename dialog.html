<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formula Formatter</title>
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
      /* Fluent / Excel look. Light by default; .dark is set from the Office theme. */
      :root {
        --bg: #ffffff; --fg: #242424; --muted: #616161; --line: #e0e0e0;
        --btn: #ffffff; --btn-line: #d1d1d1; --btn-hover: #f5f5f5;
        --primary: #107c41; --primary-hover: #0c6a37; --focus: #107c41;
        --info: #0f6cbd; --success: #107c41; --warning: #bc4b09; --error: #c50f1f; --confirm: #107c41;
      }
      html.dark {
        --bg: #292929; --fg: #ffffff; --muted: #c7c7c7; --line: #3d3d3d;
        --btn: #2e2e2e; --btn-line: #666666; --btn-hover: #3d3d3d;
        --primary: #1a8a4b; --primary-hover: #21a35a; --focus: #ffffff;
        --info: #479ef5; --success: #54b054; --warning: #faa06b; --error: #f1707b; --confirm: #54b054;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
      body { font-family: "Segoe UI", "Segoe UI Web (West European)", -apple-system, system-ui, sans-serif; font-size: 14px; }
      .wrap { height: 100%; display: flex; flex-direction: column; padding: 20px 24px 18px; opacity: 0; transition: opacity 0.12s; }
      .wrap.ready { opacity: 1; }
      .head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
      .icon { width: 22px; height: 22px; flex: 0 0 22px; color: var(--info); }
      .icon svg { display: block; width: 100%; height: 100%; }
      h1 { font-size: 16px; font-weight: 600; margin: 0; line-height: 22px; }
      .msg {
        flex: 1 1 auto; overflow: auto; margin: 0 0 0 32px; line-height: 20px; color: var(--fg);
        white-space: pre-wrap; word-break: break-word;
      }
      .actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 16px; }
      button {
        font: inherit; font-size: 14px; font-weight: 600; min-width: 96px; height: 32px; padding: 0 16px;
        border-radius: 4px; border: 1px solid var(--btn-line); background: var(--btn); color: var(--fg); cursor: pointer;
      }
      button:hover { background: var(--btn-hover); }
      button.primary { background: var(--primary); border-color: var(--primary); color: #ffffff; }
      button.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
      button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div class="wrap" id="wrap">
      <div class="head">
        <span class="icon" id="icon" aria-hidden="true"></span>
        <h1 id="title">Formula Formatter</h1>
      </div>
      <p class="msg" id="message"></p>
      <div class="actions" id="actions"></div>
    </div>
    <script type="text/javascript">
      (function () {
        var ICONS = {
          info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><rect x="11" y="10.5" width="2" height="7" rx="1" fill="#fff"/><circle cx="12" cy="7.5" r="1.25" fill="#fff"/></svg>',
          success: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
          warning: '<svg viewBox="0 0 24 24"><path d="M10.3 3.6a2 2 0 0 1 3.4 0l8 13.9A2 2 0 0 1 20 20.5H4a2 2 0 0 1-1.7-3l8-13.9z" fill="currentColor"/><rect x="11" y="8.5" width="2" height="6" rx="1" fill="#fff"/><circle cx="12" cy="17.25" r="1.25" fill="#fff"/></svg>',
          error: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M8.5 8.5l7 7m0-7l-7 7" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>',
          confirm: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.25" fill="#fff"/></svg>'
        };

        var rendered = false;

        function send(value) {
          try {
            Office.context.ui.messageParent(value);
          } catch (e) {
            /* parent closes on its own */
          }
        }

        function render(data) {
          if (rendered) return;
          rendered = true;
          var kind = ICONS[data.kind] ? data.kind : "info";
          if (data.dark) document.documentElement.className = "dark";
          var icon = document.getElementById("icon");
          icon.innerHTML = ICONS[kind];
          icon.style.color = "var(--" + kind + ")";
          document.getElementById("title").textContent = data.title || "Formula Formatter";
          document.getElementById("message").textContent = data.message || "Done.";

          var actions = document.getElementById("actions");
          function addButton(label, cls, value) {
            var b = document.createElement("button");
            b.type = "button";
            b.textContent = label;
            if (cls) b.className = cls;
            b.addEventListener("click", function () { send(value); });
            actions.appendChild(b);
            return b;
          }

          var primary;
          if (kind === "confirm") {
            primary = addButton(data.okLabel || "Continue", "primary", "ok");
            addButton("Cancel", "", "cancel");
          } else {
            primary = addButton("OK", "primary", "close");
          }
          document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") send(kind === "confirm" ? "cancel" : "close");
          });
          document.getElementById("wrap").className = "wrap ready";
          primary.focus();
        }

        // Fallback path: content passed in the URL.
        var m = /[?&]data=([^&]*)/.exec(location.search);
        if (m) {
          try { render(JSON.parse(decodeURIComponent(m[1]))); } catch (e) { /* ignore */ }
        }

        Office.onReady(function () {
          if (rendered) return;
          try {
            Office.context.ui.addHandlerAsync(Office.EventType.DialogParentMessageReceived, function (arg) {
              try { render(JSON.parse(arg.message)); } catch (e) { render({ message: String(arg.message) }); }
            }, function () { send("ready"); });
          } catch (e) {
            render({ title: "Formula Formatter", message: "" });
          }
        });
      })();
    </script>
  </body>
</html>
